<!DOCTYPE html>
<!-- Sock Drawer HTML Code From Week 2 -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sock Drawer</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1 id="title">Sock Drawer</h1>

    <input type="text" id="name" placeholder="Your name">
    <button>Set name</button>

    <h2 id="sock-count">You currently have 8 socks!</h2>

    <div class="drawer">
      <div class="sock">Left</div>
      <div class="sock" id="favorite">Red</div>
      <div class="sock">Right</div>
    </div>

    <p id ="message"></p>

    <button class="claim">Mine!</button>
  </body>
</html>
